# LLM配置
[llm]
model = "deepseek-chat"                              # 模型名称
base_url = "https://api.deepseek.com/v1"             # API基础URL（注意：需要包含/v1路径）
api_key = "your key"      # 请替换为你的API密钥
max_tokens = 8192                                   # 最大token数
temperature = 0.7                                   # 温度参数
api_type = "openai"                                 # API类型: openai, azure, ollama, anthropic




# Azure OpenAI配置示例（取消注释以使用）
# [llm]
# api_type = "azure"
# model = "YOUR_MODEL_NAME"
# base_url = "{YOUR_AZURE_ENDPOINT}/openai/deployments/{DEPLOYMENT_ID}"
# api_key = "YOUR_AZURE_API_KEY"
# api_version = "2024-08-01-preview"
# max_tokens = 4096
# temperature = 0.7

